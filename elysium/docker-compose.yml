# Blockscout explorer for Elysium (chain ID 99901, Arbitrum Nitro, native token HYPE)
#
#   cp .env.example .env   # set EXPLORER_HOST etc.
#   docker compose up -d
#
name: elysium-explorer

services:
  db:
    image: postgres:17
    restart: always
    shm_size: 256m
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blockscout}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-db:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data

  backend:
    image: ghcr.io/blockscout/blockscout-arbitrum:${BLOCKSCOUT_TAG:-latest}
    restart: always
    stop_grace_period: 5m
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_started
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - ./envs/backend.env
    environment:
      ETHEREUM_JSONRPC_HTTP_URL: ${RPC_URL:-https://rpc.chainzy.io}
      ETHEREUM_JSONRPC_FALLBACK_HTTP_URL: ${RPC_FALLBACK_URL:-https://rpc.stockium.fun}
      ETHEREUM_JSONRPC_TRACE_URL: ${RPC_URL:-https://rpc.chainzy.io}
      DATABASE_URL: postgresql://blockscout:${DB_PASSWORD:-blockscout}@db:5432/blockscout?sslmode=disable
      API_RATE_LIMIT_DISABLED: ${API_RATE_LIMIT_DISABLED:-false}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-56NtB48ear7+wMSf0IQuWDAAazhpb31qyc7GiyspBP2vh7t5zlCsF5QDv76chXeN}
    volumes:
      - backend-dets:/app/dets/

  frontend:
    image: ghcr.io/blockscout/frontend:${FRONTEND_TAG:-latest}
    restart: always
    depends_on:
      - backend
    env_file:
      - ./envs/frontend.env
    environment:
      NEXT_PUBLIC_API_HOST: ${EXPLORER_HOST:-localhost}
      NEXT_PUBLIC_APP_HOST: ${EXPLORER_HOST:-localhost}
      NEXT_PUBLIC_API_PROTOCOL: ${EXPLORER_PROTOCOL:-http}
      NEXT_PUBLIC_APP_PROTOCOL: ${EXPLORER_PROTOCOL:-http}
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ${EXPLORER_WS_PROTOCOL:-ws}
      NEXT_PUBLIC_APP_PORT: ${EXPLORER_PUBLIC_PORT:-}
      NEXT_PUBLIC_API_PORT: ${EXPLORER_PUBLIC_PORT:-}

  proxy:
    image: nginx
    restart: always
    depends_on:
      - backend
      - frontend
    volumes:
      - ./proxy:/etc/nginx/templates
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db-data:
  redis-data:
  backend-dets:
